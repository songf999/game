<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>重生之球来砖往</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', 'Arial', sans-serif;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
#gameContainer {
  position: relative;
  width: 480px;
  max-width: 100vw;
  aspect-ratio: 3/4;
  max-height: 100vh;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 8px;
  box-shadow: 0 0 40px rgba(0, 200, 255, 0.15);
}
#uiOverlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  pointer-events: none;
}
#uiOverlay.active { pointer-events: auto; }
.screen {
  display: none;
  flex-direction: column;
  align-items: center;
  text-align: center;
  color: #fff;
  padding: 20px;
}
.screen.visible { display: flex; }
.screen h1 {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: 8px;
  color: #fff;
  margin-bottom: 16px;
  text-shadow:
    0 0 10px rgba(255,200,50,0.9),
    0 0 30px rgba(255,150,0,0.6),
    0 0 60px rgba(255,80,0,0.4),
    0 2px 4px rgba(0,0,0,0.8);
  animation: titleGlow 2s ease-in-out infinite alternate;
}
@keyframes titleGlow {
  0% {
    text-shadow:
      0 0 10px rgba(255,200,50,0.9),
      0 0 30px rgba(255,150,0,0.6),
      0 0 60px rgba(255,80,0,0.4),
      0 2px 4px rgba(0,0,0,0.8);
  }
  100% {
    text-shadow:
      0 0 15px rgba(255,220,80,1),
      0 0 40px rgba(255,180,0,0.8),
      0 0 80px rgba(255,100,0,0.5),
      0 0 120px rgba(255,50,0,0.3),
      0 2px 4px rgba(0,0,0,0.8);
  }
}
.screen h2 {
  font-size: 28px;
  color: #ff6bcb;
  margin-bottom: 12px;
}
.screen p {
  font-size: 16px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 8px;
  line-height: 1.6;
}
.screen .score-display {
  font-size: 22px;
  color: #00d4ff;
  margin: 12px 0;
}
.btn {
  margin-top: 20px;
  padding: 14px 48px;
  font-size: 18px;
  font-weight: 700;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  background: linear-gradient(135deg, #7b2ff7, #00d4ff);
  color: #fff;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 20px rgba(123, 47, 247, 0.4);
}
.btn:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 30px rgba(123, 47, 247, 0.6);
}
.btn:active { transform: scale(0.97); }
.controls-hint {
  margin-top: 24px;
  font-size: 13px;
  color: rgba(255,255,255,0.4);
}
.level-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 16px;
  max-width: 360px;
}
.level-card {
  width: 100px;
  height: 110px;
  border-radius: 12px;
  border: 2px solid rgba(255,255,255,0.15);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  position: relative;
  overflow: hidden;
}
.level-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  opacity: 0.15;
  border-radius: 10px;
}
.level-card:hover {
  transform: scale(1.08);
  border-color: rgba(0,212,255,0.6);
  box-shadow: 0 0 20px rgba(0,212,255,0.3);
}
.level-card:active { transform: scale(0.96); }
.level-card .level-num {
  font-size: 28px;
  font-weight: 900;
  color: #fff;
  z-index: 1;
}
.level-card .level-name {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  margin-top: 4px;
  z-index: 1;
}
.level-card .level-stars {
  font-size: 10px;
  margin-top: 3px;
  z-index: 1;
}
.btn-secondary {
  margin-top: 16px;
  padding: 10px 36px;
  font-size: 15px;
  font-weight: 700;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50px;
  cursor: pointer;
  background: transparent;
  color: rgba(255,255,255,0.7);
  letter-spacing: 1px;
  transition: all 0.15s;
}
.btn-secondary:hover {
  border-color: rgba(0,212,255,0.6);
  color: #fff;
  background: rgba(0,212,255,0.1);
}
.taunt-text {
  font-size: 20px;
  font-weight: 700;
  color: #ff6b6b;
  margin: 12px 0;
  animation: tauntShake 0.5s ease-in-out infinite alternate, tauntPulse 1s ease-in-out infinite;
  text-shadow: 0 0 10px rgba(255,107,107,0.5);
  letter-spacing: 2px;
}
@keyframes tauntShake {
  0% { transform: translateX(-3px) rotate(-1deg); }
  100% { transform: translateX(3px) rotate(1deg); }
}
@keyframes tauntPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
.taunt-emoji {
  font-size: 48px;
  animation: tauntBounce 0.6s ease-in-out infinite alternate;
  margin-bottom: 8px;
}
@keyframes tauntBounce {
  0% { transform: scale(1) translateY(0); }
  100% { transform: scale(1.15) translateY(-8px); }
}
.bulletin-board {
  background: linear-gradient(135deg, rgba(30,30,60,0.95), rgba(20,20,50,0.98));
  border: 2px solid rgba(0,212,255,0.3);
  border-radius: 12px;
  padding: 16px 20px;
  margin: 12px 0;
  max-width: 380px;
  position: relative;
  overflow: hidden;
}
.bulletin-board::before {
  content: '📢 公告';
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: #00d4ff;
  letter-spacing: 2px;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(0,212,255,0.2);
}
.bulletin-board .bulletin-item {
  font-size: 14px;
  color: rgba(255,255,255,0.85);
  line-height: 1.8;
  text-align: left;
  padding-left: 16px;
  position: relative;
}
.bulletin-board .bulletin-item::before {
  content: '▸';
  position: absolute;
  left: 0;
  color: #ffd43b;
}
.bulletin-board .bulletin-item.highlight {
  color: #ffd43b;
  font-weight: 700;
}
.bulletin-board .bulletin-item.new {
  color: #ff6b6b;
}
.bulletin-board .bulletin-item.new::before {
  content: '★';
  color: #ff6b6b;
}
.pet-container {
  position: absolute;
  bottom: 50px;
  right: 10px;
  width: 60px;
  height: 60px;
  pointer-events: none;
  z-index: 10;
}
.pet-canvas {
  width: 60px;
  height: 60px;
}
.victory-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 100;
  background: rgba(0,0,0,0.8);
}
.victory-overlay.active {
  display: flex;
}
.victory-text {
  font-size: 42px;
  font-weight: 900;
  background: linear-gradient(135deg, #ffd700, #ff6b6b, #ff9ff3, #00d4ff, #69db7c, #ffd700);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: victoryGradient 2s ease infinite;
  letter-spacing: 6px;
}
@keyframes victoryGradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.victory-sub {
  font-size: 20px;
  color: #ffd700;
  margin-top: 16px;
  animation: tauntPulse 1.5s ease-in-out infinite;
}
.victory-score {
  font-size: 28px;
  color: #fff;
  margin-top: 12px;
  font-weight: 700;
}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="uiOverlay" class="active">
    <div id="startScreen" class="screen visible">
      <h1>重生之球来砖往</h1>
      <div class="bulletin-board">
        <div class="bulletin-item">鼠标移动控制挡板，空格键发射小球</div>
        <div class="bulletin-item">击碎砖块得分，拾取道具存入背包</div>
        <div class="bulletin-item">A S D F 键使用道具（每局5次）</div>
        <div class="bulletin-item highlight">第9关通过可获得随机桌宠！</div>
        <div class="bulletin-item new">累计100000分即可通关！</div>
        <div class="bulletin-item">通关后循环关卡，难度逐轮递增</div>
      </div>
      <button class="btn" id="startBtn">开始游戏</button>
      <button class="btn-secondary" id="selectLevelBtn">选择关卡</button>
    </div>
    <div id="levelSelectScreen" class="screen">
      <h2>选择关卡</h2>
      <div class="level-grid" id="levelGrid"></div>
      <button class="btn-secondary" id="backToStartBtn">返回</button>
    </div>
    <div id="pauseScreen" class="screen">
      <h2>暂停</h2>
      <button class="btn" id="resumeBtn">继续游戏</button>
    </div>
    <div id="gameOverScreen" class="screen">
      <h2 id="gameOverTitle">游戏结束</h2>
      <div class="taunt-text" id="tauntText"></div>
      <div class="score-display" id="finalScore">得分: 0</div>
      <p id="finalLevel">到达关卡: 1</p>
      <button class="btn" id="restartBtn">重新开始</button>
    </div>
    <div id="levelCompleteScreen" class="screen">
      <h2>关卡完成！</h2>
      <div class="score-display" id="levelScore">得分: 0</div>
      <button class="btn" id="nextLevelBtn">下一关</button>
    </div>
  </div>
  <div class="pet-container" id="petContainer" style="display:none;">
    <canvas class="pet-canvas" id="petCanvas" width="60" height="60"></canvas>
  </div>
  <div class="victory-overlay" id="victoryOverlay">
    <div class="victory-text">通 关</div>
    <div class="victory-sub">恭喜达成100000分！</div>
    <div class="victory-score" id="victoryScore">最终得分: 0</div>
    <button class="btn" id="victoryRestartBtn" style="margin-top:24px;">再来一局</button>
  </div>
</div>

    } else if (activePet.type === 'bear') {
      pctx.fillStyle = activePet.color;
      pctx.beginPath(); pctx.arc(cx, cy, 14, 0, Math.PI * 2); pctx.fill();
      pctx.beginPath(); pctx.arc(cx - 12, cy - 12, 6, 0, Math.PI * 2); pctx.fill();
      pctx.beginPath(); pctx.arc(cx + 12, cy - 12, 6, 0, Math.PI * 2); pctx.fill();
      pctx.fillStyle = '#e8a0b0';
      pctx.beginPath(); pctx.arc(cx - 12, cy - 12, 3, 0, Math.PI * 2); pctx.fill();
      pctx.beginPath(); pctx.arc(cx + 12, cy - 12, 3, 0, Math.PI * 2); pctx.fill();
      pctx.fillStyle = activePet.eyeColor;
      pctx.beginPath(); pctx.arc(cx - 5, cy - 2, 3, 0, Math.PI * 2); pctx.fill();
      pctx.beginPath(); pctx.arc(cx + 5, cy - 2, 3, 0, Math.PI * 2); pctx.fill();
      pctx.fillStyle = '#333';
      pctx.beginPath(); pctx.arc(cx - 5, cy - 2, 1.5, 0, Math.PI * 2); pctx.fill();
      pctx.beginPath(); pctx.arc(cx + 5, cy - 2, 1.5, 0, Math.PI * 2); pctx.fill();
      pctx.fillStyle = '#333';
      pctx.beginPath(); pctx.ellipse(cx, cy + 4, 4, 3, 0, 0, Math.PI * 2); pctx.fill();
    }

    pctx.restore();
  }

  var victoryParticles = [];
  var victoryAnimId = null;

  function triggerVictory() {
    hasWon = true;
    gameState = STATE.GAME_OVER;
    stopBGM();
    soundPowerUp();
    setTimeout(function() { soundPowerUp(); }, 300);
    setTimeout(function() { soundPowerUp(); }, 600);

    var overlay = document.getElementById('victoryOverlay');
    overlay.classList.add('active');
    document.getElementById('victoryScore').textContent = '最终得分: ' + score;

    victoryParticles = [];
    for (var i = 0; i < 150; i++) {
      victoryParticles.push({
        x: W / 2,
        y: H / 2,
        vx: (Math.random() - 0.5) * 16,
        vy: (Math.random() - 0.5) * 16,
        r: Math.random() * 5 + 2,
        color: ['#ffd700','#ff6b6b','#00d4ff','#51cf66','#b197fc','#ff9ff3','#ff8c00','#69db7c'][Math.floor(Math.random() * 8)],
        life: 1,
        decay: 0.003 + Math.random() * 0.008
      });
    }
    animateVictory();
  }

  function animateVictory() {
    var vCanvas = document.getElementById('gameCanvas');
    var vctx = vCanvas.getContext('2d');

    vctx.fillStyle = 'rgba(0,0,0,0.08)';
    vctx.fillRect(0, 0, W, H);

    var alive = false;
    for (var i = 0; i < victoryParticles.length; i++) {
      var p = victoryParticles[i];
      if (p.life <= 0) continue;
      alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.life -= p.decay;
      vctx.globalAlpha = p.life;
      vctx.fillStyle = p.color;
      vctx.shadowColor = p.color;
      vctx.shadowBlur = 6;
      vctx.beginPath();
      vctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      vctx.fill();
    }
    vctx.globalAlpha = 1;
    vctx.shadowBlur = 0;

    if (alive) {
      victoryAnimId = requestAnimationFrame(animateVictory);
    }
  }

  function resetGame() {
    score = 0;
    lives = 3;
    level = 1;
    combo = 0;
    cycle = 0;
    speedPenalty = 0;
    hasWon = false;
    inventory = [null, null, null, null];
    inventoryUses = 5;
    particles = [];
    trails = [];
    powerUps = [];
    activePowerUps = {};
    stopBGM();
    stopPetAnimation();
    activePet = null;
    document.getElementById('petContainer').style.display = 'none';
    document.getElementById('victoryOverlay').classList.remove('active');
    if (victoryAnimId) { cancelAnimationFrame(victoryAnimId); victoryAnimId = null; }
    initPaddle();
    initBall();
    createBricks();
  }

  function startLevel() {
    combo = 0;
    particles = [];
    trails = [];
    powerUps = [];
    activePowerUps = {};
    inventory = [null, null, null, null];
    initPaddle();
    initBall();
    createBricks();
    gameState = STATE.LAUNCHING;
  }

  function spawnParticles(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 1 + Math.random() * 3;
      particles.push({
        x: x, y: y,
        dx: Math.cos(angle) * speed,
        dy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.015 + Math.random() * 0.025,
        size: 2 + Math.random() * 4,
        color: color
      });
    }
  }

  function spawnPowerUp(x, y, type) {
    var info = POWERUP_TYPES[type];
    powerUps.push({
      x: x, y: y,
      w: 24, h: 24,
      dy: 2,
      type: type,
      color: info.color,
      symbol: info.symbol,
      alive: true
    });
  }

  function activatePowerUp(type) {
    if (type === 'WIDE') {
      paddle.w = 130;
      activePowerUps.WIDE = Date.now() + POWERUP_TYPES.WIDE.duration;
    } else if (type === 'MULTI') {
      for (var i = 0; i < 2; i++) {
        var angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
        extraBalls.push({
          x: ball.x, y: ball.y,
          r: ball.r, speed: ball.speed,
          dx: Math.cos(angle) * ball.speed,
          dy: Math.sin(angle) * ball.speed,
          alive: true
        });
      }
    } else if (type === 'SLOW') {
      ball.speed = Math.max(2.5, ball.speed * 0.65);
      var mag = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
      if (mag > 0) {
        ball.dx = (ball.dx / mag) * ball.speed;
        ball.dy = (ball.dy / mag) * ball.speed;
      }
      activePowerUps.SLOW = Date.now() + POWERUP_TYPES.SLOW.duration;
    } else if (type === 'LIFE') {
      lives = Math.min(lives + 1, 5);
    } else if (type === 'BIG') {
      var angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.0;
      extraBalls.push({
        x: ball.x, y: ball.y,
        r: 3, growTarget: 14, speed: ball.speed,
        dx: Math.cos(angle) * ball.speed,
        dy: Math.sin(angle) * ball.speed,
        alive: true
      });
    }
  }

  function updatePowerUpTimers() {
    var now = Date.now();
    if (activePowerUps.WIDE && now > activePowerUps.WIDE) {
      paddle.w = 90;
      delete activePowerUps.WIDE;
    }
    if (activePowerUps.SLOW && now > activePowerUps.SLOW) {
      ball.speed = 4.5 + level * 0.3;
      var mag = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
      if (mag > 0) {
        ball.dx = (ball.dx / mag) * ball.speed;
        ball.dy = (ball.dy / mag) * ball.speed;
      }
      delete activePowerUps.SLOW;
    }
  }

  function clamp(val, min, max) {
    return Math.max(min, Math.min(max, val));
  }

  function ballBrickCollision(bx, by, br, brick) {
    var closestX = clamp(bx, brick.x, brick.x + brick.w);
    var closestY = clamp(by, brick.y, brick.y + brick.h);
    var distX = bx - closestX;
    var distY = by - closestY;
    return (distX * distX + distY * distY) < (br * br);
}

  function updateBall(b) {
    if (b.attached) {
      b.x = paddle.x + paddle.w / 2;
      b.y = paddle.y - b.r - 1;
      return;
    }

    b.x += b.dx;
    b.y += b.dy;

    if (b.growTarget && b.r < b.growTarget) {
      b.r = Math.min(b.r + 0.15, b.growTarget);
    }

    if (b.x - b.r <= 0) { b.x = b.r; b.dx = Math.abs(b.dx); soundWallHit(); }
    if (b.x + b.r >= W) { b.x = W - b.r; b.dx = -Math.abs(b.dx); soundWallHit(); }
    if (b.y - b.r <= 0) { b.y = b.r; b.dy = Math.abs(b.dy); soundWallHit(); }

    if (b.dy > 0 &&
        b.y + b.r >= paddle.y &&
        b.y + b.r <= paddle.y + paddle.h + 4 &&
        b.x >= paddle.x - 2 &&
        b.x <= paddle.x + paddle.w + 2) {
      var hitPos = (b.x - paddle.x) / paddle.w;
      hitPos = clamp(hitPos, 0, 1);
      var angle = -Math.PI * (0.15 + hitPos * 0.7);
      var spd = b.speed;
      b.dx = Math.cos(angle) * spd;
      b.dy = Math.sin(angle) * spd;
      b.y = paddle.y - b.r - 1;
      combo = 0;
      soundPaddleHit();
    }

    for (var i = 0; i < bricks.length; i++) {
      var brick = bricks[i];
      if (!brick.alive) continue;
      if (ballBrickCollision(b.x, b.y, b.r, brick)) {
        brick.hp--;
        brick.shakeTime = 6;
        combo++;
        var bonus = combo > 1 ? combo : 1;
        score += 10 * bonus;

        if (brick.hp <= 0) {
          brick.alive = false;
          soundBrickBreak();
          spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color[0], 12);
          if (brick.powerUp) {
            spawnPowerUp(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.powerUp);
          }
        } else {
          soundBrickHit();
          spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color[0], 4);
        }

        var bCenterX = brick.x + brick.w / 2;
        var bCenterY = brick.y + brick.h / 2;
        var dx = b.x - bCenterX;
        var dy = b.y - bCenterY;
        var overlapX = (brick.w / 2 + b.r) - Math.abs(dx);
        var overlapY = (brick.h / 2 + b.r) - Math.abs(dy);

        if (overlapX < overlapY) {
          b.dx = dx > 0 ? Math.abs(b.dx) : -Math.abs(b.dx);
        } else {
          b.dy = dy > 0 ? Math.abs(b.dy) : -Math.abs(b.dy);
        }
        break;
      }
    }

    if (trails.length < 200) {
      trails.push({ x: b.x, y: b.y, life: 1 });
    }
  }

  function update() {
    if (gameState !== STATE.PLAYING && gameState !== STATE.LAUNCHING) return;

    updatePowerUpTimers();

    if (keys['ArrowLeft']) {
      paddle.targetX = paddle.x - paddle.speed;
    }
    if (keys['ArrowRight']) {
      paddle.targetX = paddle.x + paddle.speed;
    }

    paddle.targetX = clamp(paddle.targetX, 0, W - paddle.w);
    paddle.x += (paddle.targetX - paddle.x) * 0.3;
    paddle.x = clamp(paddle.x, 0, W - paddle.w);

    if (ball.attached) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
    }

    updateBall(ball);

    for (var ei = extraBalls.length - 1; ei >= 0; ei--) {
      var eb = extraBalls[ei];
      updateBall(eb);
      if (eb.y - eb.r > H) {
        eb.alive = false;
      }
      if (!eb.alive) {
        extraBalls.splice(ei, 1);
      }
    }

    if (!ball.attached && ball.y - ball.r > H) {
      if (extraBalls.length > 0) {
        var replacement = extraBalls.shift();
        ball.x = replacement.x;
        ball.y = replacement.y;
        ball.dx = replacement.dx;
        ball.dy = replacement.dy;
        ball.speed = replacement.speed;
        ball.attached = false;
      } else {
        lives--;
        combo = 0;
        speedPenalty += 0.5;
        soundBallLost();
        if (lives <= 0) {
          gameState = STATE.GAME_OVER;
          stopBGM();
          soundGameOver();
          showGameOverTaunt(false);
          showScreen('gameOverScreen');
          document.getElementById('finalScore').textContent = '得分: ' + score;
          document.getElementById('finalLevel').textContent = '到达关卡: ' + level;
        } else {
          initBall();
          gameState = STATE.LAUNCHING;
        }
      }
    }

    for (var pi = powerUps.length - 1; pi >= 0; pi--) {
      var pu = powerUps[pi];
      pu.y += pu.dy;
      if (pu.y + pu.h >= paddle.y &&
          pu.y <= paddle.y + paddle.h &&
          pu.x + pu.w / 2 >= paddle.x &&
          pu.x - pu.w / 2 <= paddle.x + paddle.w) {
        var stored = false;
        for (var si = 0; si < inventory.length; si++) {
          if (inventory[si] === null) {
            inventory[si] = pu.type;
            stored = true;
            break;
          }
        }
        if (!stored) {
          activatePowerUp(pu.type);
        }
        soundPowerUp();
        spawnParticles(pu.x, pu.y, pu.color, 8);
        powerUps.splice(pi, 1);
        continue;
      }
      if (pu.y > H + 30) {
        powerUps.splice(pi, 1);
      }
    }

    for (var ti = trails.length - 1; ti >= 0; ti--) {
      trails[ti].life -= 0.06;
      if (trails[ti].life <= 0) trails.splice(ti, 1);
    }

    for (var ppi = particles.length - 1; ppi >= 0; ppi--) {
      var p = particles[ppi];
      p.x += p.dx;
      p.y += p.dy;
      p.dy += 0.05;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(ppi, 1);
    }

    var allDead = true;
    for (var bi = 0; bi < bricks.length; bi++) {
      if (bricks[bi].alive) { allDead = false; break; }
    }
    if (allDead && gameState === STATE.PLAYING) {
      stopBGM();
      if (score >= WIN_SCORE && !hasWon) {
        triggerVictory();
        return;
      }
      if (level === 9 && !activePet) {
        var pet = grantPet();
        gameState = STATE.LEVEL_COMPLETE;
        showScreen('levelCompleteScreen');
        document.getElementById('levelScore').textContent = '得分: ' + score + ' | 获得桌宠: ' + pet.name + '！';
        return;
      }
      if (level >= maxLevel) {
        cycle++;
        level = 1;
        gameState = STATE.LEVEL_COMPLETE;
        showScreen('levelCompleteScreen');
        document.getElementById('levelScore').textContent = '得分: ' + score + ' | 第' + (cycle + 1) + '轮开始！';
      } else {
        gameState = STATE.LEVEL_COMPLETE;
        showScreen('levelCompleteScreen');
        document.getElementById('levelScore').textContent = '得分: ' + score;
      }
    }
  }

  function drawRoundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function draw() {
    var theme = getTheme();

    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, W, H);

    var grd = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W);
    grd.addColorStop(0, theme.bgGlow);
    grd.addColorStop(1, 'rgba(10, 10, 40, 0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    for (var ti = 0; ti < trails.length; ti++) {
      var t = trails[ti];
      ctx.globalAlpha = t.life * 0.35;
      ctx.fillStyle = theme.trail;
      ctx.beginPath();
      ctx.arc(t.x, t.y, ball.r * t.life * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (var bi = 0; bi < bricks.length; bi++) {
      var brick = bricks[bi];
      if (!brick.alive) continue;
      var sx = 0, sy = 0;
      if (brick.shakeTime > 0) {
        sx = (Math.random() - 0.5) * 3;
        sy = (Math.random() - 0.5) * 3;
        brick.shakeTime--;
      }

      var alpha = 0.5 + (brick.hp / brick.maxHp) * 0.5;
      ctx.globalAlpha = alpha;

      ctx.save();
      ctx.shadowColor = brick.color[0];
      ctx.shadowBlur = 6;
      var bGrd = ctx.createLinearGradient(brick.x + sx, brick.y + sy, brick.x + sx + brick.w, brick.y + brick.h + sy);
      bGrd.addColorStop(0, brick.color[0]);
      bGrd.addColorStop(0.5, brick.color[1]);
      bGrd.addColorStop(1, brick.color[0]);
      ctx.fillStyle = bGrd;
      drawRoundRect(brick.x + sx, brick.y + sy, brick.w, brick.h, 4);
      ctx.fill();
      ctx.restore();

      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#fff';
      drawRoundRect(brick.x + sx + 3, brick.y + sy + 2, brick.w - 6, brick.h / 2.5, 2);
      ctx.fill();

      ctx.globalAlpha = 0.1;
      ctx.fillStyle = '#000';
      drawRoundRect(brick.x + sx + 3, brick.y + sy + brick.h * 0.6, brick.w - 6, brick.h * 0.35, 2);
      ctx.fill();

      ctx.globalAlpha = 1;
      if (brick.hp > 1) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(brick.hp, brick.x + brick.w / 2 + sx, brick.y + brick.h / 2 + sy);
      }
    }
    ctx.globalAlpha = 1;

    for (var pi = 0; pi < powerUps.length; pi++) {
      var pu = powerUps[pi];
      ctx.save();
      ctx.shadowColor = pu.color;
      ctx.shadowBlur = 10;
      ctx.fillStyle = pu.color;
      ctx.beginPath();
      ctx.arc(pu.x, pu.y, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pu.symbol, pu.x, pu.y);
    }

    ctx.save();
    ctx.shadowColor = theme.ballGlow;
    ctx.shadowBlur = 15;
    var pGrd = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x + paddle.w, paddle.y);
    pGrd.addColorStop(0, theme.paddle[0]);
    pGrd.addColorStop(0.5, theme.paddle[1]);
    pGrd.addColorStop(1, theme.paddle[2]);
    ctx.fillStyle = pGrd;
    drawRoundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
    ctx.restore();

    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#fff';
    drawRoundRect(paddle.x + 4, paddle.y + 2, paddle.w - 8, paddle.h / 2.5, 3);
    ctx.fill();
    ctx.globalAlpha = 1;

    function drawBallObj(b) {
      var isBig = b.growTarget && b.growTarget > 10;
      var glowColor = isBig ? '#ff9ff3' : theme.ballGlow;
      var ballColors = isBig ? ['#ffffff','#ff9ff3','#c44ddb'] : theme.ball;
      ctx.save();
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = isBig ? 20 : 15;
      var ballGrd = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
      ballGrd.addColorStop(0, ballColors[0]);
      ballGrd.addColorStop(0.4, ballColors[1]);
      ballGrd.addColorStop(1, ballColors[2]);
      ctx.fillStyle = ballGrd;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.restore();
    }
    drawBallObj(ball);
    for (var ebi = 0; ebi < extraBalls.length; ebi++) {
      drawBallObj(extraBalls[ebi]);
    }

    for (var ppi = 0; ppi < particles.length; ppi++) {
      var p = particles[ppi];
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawHUD();

    if (gameState === STATE.LAUNCHING) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('按空格键 或 点击屏幕 发射小球', W / 2, H - 10);
    }
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, W, 36);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('得分: ' + score, 12, 24);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#00d4ff';
    var cycleStr = cycle > 0 ? ' [第' + (cycle + 1) + '轮]' : '';
    ctx.fillText('关卡 ' + level + ' · ' + getTheme().name + cycleStr, W / 2, 24);

    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,212,59,0.6)';
    ctx.font = '11px Arial';
    var progress = Math.min(score / WIN_SCORE * 100, 100).toFixed(1);
    ctx.fillText('通关进度: ' + progress + '%', W / 2, 40);
    ctx.font = 'bold 16px Arial';

    ctx.textAlign = 'right';
    var heartsStr = '';
    for (var i = 0; i < lives; i++) heartsStr += '♥ ';
    ctx.fillStyle = '#ff6b6b';
    ctx.fillText(heartsStr, W - 12, 24);

    if (combo > 1) {
      ctx.fillStyle = '#ffd43b';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('连击 x' + combo, W / 2, 50);
    }

    var slotW = 40, slotH = 32, slotGap = 6;
    var totalSlotW = inventory.length * slotW + (inventory.length - 1) * slotGap;
    var slotStartX = (W - totalSlotW) / 2;
    var slotY = H - 38;

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, slotY - 6, W, 44);

    for (var ii = 0; ii < inventory.length; ii++) {
      var sx = slotStartX + ii * (slotW + slotGap);
      var hasItem = inventory[ii] !== null;
      var canUse = hasItem && inventoryUses > 0;

      ctx.strokeStyle = canUse ? 'rgba(0,212,255,0.8)' : 'rgba(255,255,255,0.2)';
      ctx.lineWidth = canUse ? 2 : 1;
      drawRoundRect(sx, slotY, slotW, slotH, 5);
      ctx.stroke();

      if (hasItem) {
        var puInfo = POWERUP_TYPES[inventory[ii]];
        ctx.globalAlpha = canUse ? 1 : 0.4;
        ctx.fillStyle = puInfo.color;
        drawRoundRect(sx + 2, slotY + 2, slotW - 4, slotH - 4, 4);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(puInfo.symbol, sx + slotW / 2, slotY + slotH / 2);
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = canUse ? 'rgba(0,212,255,0.9)' : 'rgba(255,255,255,0.3)';
      ctx.font = 'bold 10px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(INVENTORY_LABELS[ii], sx + slotW / 2, slotY + slotH + 1);
    }

    ctx.fillStyle = inventoryUses > 0 ? '#ffd43b' : '#ff6b6b';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText('使用次数: ' + inventoryUses, W - 10, slotY + slotH / 2);
  }

  function showScreen(id) {
    var screens = document.querySelectorAll('.screen');
    screens.forEach(function(s) { s.classList.remove('visible'); });
    document.getElementById(id).classList.add('visible');
    overlay.classList.add('active');
  }

  function hideOverlay() {
    var screens = document.querySelectorAll('.screen');
    screens.forEach(function(s) { s.classList.remove('visible'); });
    overlay.classList.remove('active');
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  document.addEventListener('keydown', function(e) {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Space') {
      e.preventDefault();
      if (gameState === STATE.LAUNCHING) {
        launchBall();
      }
    }
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      if (gameState === STATE.PLAYING) {
        gameState = STATE.PAUSED;
        stopBGM();
        showScreen('pauseScreen');
      } else if (gameState === STATE.PAUSED) {
        gameState = STATE.PLAYING;
        startBGM();
        hideOverlay();
      }
    }
    var keyLower = e.key.toLowerCase();
    for (var ki = 0; ki < INVENTORY_KEYS.length; ki++) {
      if (keyLower === INVENTORY_KEYS[ki] && inventory[ki] !== null && inventoryUses > 0) {
        if (gameState === STATE.PLAYING || gameState === STATE.LAUNCHING) {
          activatePowerUp(inventory[ki]);
          inventory[ki] = null;
          inventoryUses--;
          playSound(880, 0.1, 'sine', 0.15);
          setTimeout(function() { playSound(1100, 0.12, 'sine', 0.12); }, 50);
        }
      }
    }
  });

  document.addEventListener('keyup', function(e) {
    keys[e.key] = false;
  });

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (gameState === STATE.LAUNCHING) {
      launchBall();
      return;
    }
    var touch = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    var scaleX = W / rect.width;
    touchStartX = touch.clientX * scaleX;
    touchPaddleStartX = paddle.x;
    isTouching = true;
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (!isTouching) return;
    var touch = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    var scaleX = W / rect.width;
    var currentX = touch.clientX * scaleX;
    var deltaX = currentX - touchStartX;
    paddle.targetX = clamp(touchPaddleStartX + deltaX, 0, W - paddle.w);
  }, { passive: false });

  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    isTouching = false;
  }, { passive: false });

  canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = W / rect.width;
    var mouseX = (e.clientX - rect.left) * scaleX;
    paddle.targetX = clamp(mouseX - paddle.w / 2, 0, W - paddle.w);
  });

  canvas.addEventListener('click', function(e) {
    if (gameState === STATE.LAUNCHING) {
      launchBall();
    }
  });

  document.getElementById('startBtn').addEventListener('click', function() {
    resetGame();
    gameState = STATE.LAUNCHING;
    startBGM();
    hideOverlay();
  });

  document.getElementById('selectLevelBtn').addEventListener('click', function() {
    buildLevelGrid();
    showScreen('levelSelectScreen');
  });

  document.getElementById('backToStartBtn').addEventListener('click', function() {
    showScreen('startScreen');
  });

  function buildLevelGrid() {
    var grid = document.getElementById('levelGrid');
    grid.innerHTML = '';
    for (var i = 0; i < LEVEL_THEMES.length; i++) {
      var card = document.createElement('div');
      card.className = 'level-card';
      card.style.background = 'linear-gradient(135deg, ' + LEVEL_THEMES[i].bg + ', rgba(0,0,0,0.6))';
      card.style.borderColor = LEVEL_THEMES[i].ballGlow;
      var layout = LEVEL_LAYOUTS[i];
      var previewHtml = '<div style="display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:3px;">';
      for (var pr = 0; pr < layout.length; pr++) {
        previewHtml += '<div style="display:flex;gap:1px;">';
        for (var pc = 0; pc < layout[pr].length; pc++) {
          var dotColor = layout[pr][pc] ? LEVEL_THEMES[i].ballGlow : 'transparent';
          previewHtml += '<div style="width:4px;height:3px;background:' + dotColor + ';border-radius:1px;opacity:' + (layout[pr][pc] ? '0.8' : '0') + ';"></div>';
        }
        previewHtml += '</div>';
      }
      previewHtml += '</div>';
      card.innerHTML =
        '<span class="level-num">' + (i + 1) + '</span>' +
        '<span class="level-name">' + LEVEL_THEMES[i].name + '</span>' +
        previewHtml;
      card.setAttribute('data-level', i + 1);
      card.addEventListener('click', onLevelCardClick);
      grid.appendChild(card);
    }
  }

  function onLevelCardClick(e) {
    var lv = parseInt(e.currentTarget.getAttribute('data-level'));
    level = lv;
    score = 0;
    lives = 3;
    combo = 0;
    speedPenalty = 0;
    inventory = [null, null, null, null];
    inventoryUses = 5;
    particles = [];
    trails = [];
    powerUps = [];
    activePowerUps = {};
    initPaddle();
    initBall();
    createBricks();
    gameState = STATE.LAUNCHING;
    startBGM();
    hideOverlay();
  }

  document.getElementById('resumeBtn').addEventListener('click', function() {
    gameState = STATE.PLAYING;
    startBGM();
    hideOverlay();
  });

  document.getElementById('restartBtn').addEventListener('click', function() {
    resetGame();
    gameState = STATE.LAUNCHING;
    startBGM();
    hideOverlay();
  });

  document.getElementById('nextLevelBtn').addEventListener('click', function() {
    level++;
    startLevel();
    startBGM();
    hideOverlay();
  });

  document.getElementById('victoryRestartBtn').addEventListener('click', function() {
    resetGame();
    gameState = STATE.LAUNCHING;
    startBGM();
    hideOverlay();
  });

  resetGame();
  gameLoop();
})();
</script>
</body>
</html>
